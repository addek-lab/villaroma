name: Deploy to FTP
on:
  push:
    branches:
      - main
jobs:
  web-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
      
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm install
      
    - name: Build project
      run: npm run build
      
    - name: Sync files via SFTP
      run: |
        sudo apt-get update && sudo apt-get install -y lftp
        lftp -c "set sftp:auto-confirm yes; open -u ${{ secrets.FTP_USERNAME }},'${{ secrets.FTP_PASSWORD }}' sftp://${{ secrets.FTP_SERVER }}; mirror -R ./out/ ./"
